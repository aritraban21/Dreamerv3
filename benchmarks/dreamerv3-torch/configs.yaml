defaults:

  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0
  deterministic_run: False
  steps: 1e6
  parallel: False
  eval_every: 1e4
  eval_episode_num: 10
  log_every: 1e4
  reset_every: 0
  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  video_pred_log: True
  # Parity rendered-pendulum videos (our-style env + imagination mp4s). Off by default.
  render_video: False
  video_dir: 'videos'
  imag_video_horizon: 200

  # Environment
  task: 'dmc_walker_walk'
  size: [64, 64]
  envs: 1
  action_repeat: 2
  time_limit: 1000
  grayscale: False
  prefill: 2500
  reward_EMA: True

  # Model
  dyn_hidden: 512
  dyn_deter: 512
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  grad_heads: ['decoder', 'reward', 'cont']
  units: 512
  act: 'SiLU'
  norm: True
  encoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, symlog_inputs: True}
  decoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}
  actor:
    {layers: 2, dist: 'normal', entropy: 3e-4, unimix_ratio: 0.01, std: 'learned', min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic:
    {layers: 2, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  reward_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  cont_head:
    {layers: 2, loss_scale: 1.0, outscale: 1.0}
  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'

  # Training
  batch_size: 16
  batch_length: 64
  train_ratio: 512
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  dataset_size: 1000000
  opt: 'adam'

  # Behavior.
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 15
  imag_gradient: 'dynamics'
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # Exploration
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

dmc_proprio:
  steps: 5e5
  action_repeat: 2
  envs: 4
  train_ratio: 512
  video_pred_log: false
  encoder: {mlp_keys: '.*', cnn_keys: '$^'}
  decoder: {mlp_keys: '.*', cnn_keys: '$^'}

pointmass:
  device: cpu
  steps: 5e3
  action_repeat: 1
  envs: 1
  train_ratio: 128
  video_pred_log: false
  encoder: {mlp_keys: 'state', cnn_keys: '$^'}
  decoder: {mlp_keys: 'state', cnn_keys: '$^'}
  batch_size: 16
  batch_length: 20
  imag_horizon: 8
  dyn_hidden: 128
  dyn_deter: 128
  dyn_stoch: 8
  dyn_discrete: 8
  units: 128
  eval_every: 500
  eval_episode_num: 5
  log_every: 100
  time_limit: 20
  prefill: 400

pendulum_small:
  # TRUE apples-to-apples with our actual Pendulum runs: sizes matched to
  # configs/pendulum.yaml (embed_dim=256, deter_dim=512, stoch=16x16, hidden=256).
  # This is the decisive control: if the reference is STABLE at this size while our
  # code diverges, the divergence is a bug in our code (not capacity/hyperparams).
  task: pendulum_pendulum
  device: cuda:0
  steps: 200000
  action_repeat: 1
  envs: 1
  train_ratio: 512
  video_pred_log: false
  encoder: {mlp_keys: 'state', cnn_keys: '$^', mlp_layers: 2, mlp_units: 256}
  decoder: {mlp_keys: 'state', cnn_keys: '$^', mlp_layers: 2, mlp_units: 256}
  batch_size: 16
  batch_length: 64
  imag_horizon: 16
  dyn_hidden: 256                  # ours hidden_dim
  dyn_deter: 512                   # ours deter_dim
  dyn_stoch: 16                    # ours stoch_dim
  dyn_discrete: 16                 # ours stoch_classes
  units: 256                       # ours hidden_dim (MLP width for heads/actor/critic)
  eval_every: 5000
  eval_episode_num: 25
  log_every: 1000
  time_limit: 200
  prefill: 1000
  video_dir: 'videos/pendulum_small'
  imag_video_horizon: 200

pendulum:
  # Reference DreamerV3 on Pendulum-v1 at LARGE (paper-ish) capacity: sizes matched to
  # configs/default.yaml (dyn_deter=4096, stoch=32x32, units=1024). NOTE: this is BIGGER
  # than our actual Pendulum runs, which used the configs/pendulum.yaml overrides above.
  # Kept as a high-capacity reference point (this run reached ~-145 and held stable).
  # For the true apples-to-apples control against our runs, use `pendulum_small`.
  task: pendulum_pendulum          # suite=pendulum -> envs/pendulum.py
  device: cuda:0
  steps: 200000
  action_repeat: 1
  envs: 1
  train_ratio: 512
  video_pred_log: false            # no image obs -> no openl image reconstruction
  encoder: {mlp_keys: 'state', cnn_keys: '$^'}
  decoder: {mlp_keys: 'state', cnn_keys: '$^'}
  batch_size: 16
  batch_length: 64
  imag_horizon: 16                 # ours = 16 (ref default 15)
  dyn_hidden: 1024                 # ours hidden_dim
  dyn_deter: 4096                  # ours deter_dim
  dyn_stoch: 32
  dyn_discrete: 32
  units: 1024                      # ours hidden_dim
  eval_every: 5000
  eval_episode_num: 25             # ours eval_episodes
  log_every: 1000
  time_limit: 200                  # Pendulum-v1 episode length
  prefill: 1000                    # ours prefill_steps
  # Parity rendered videos: pass --render_video True on the CLI to enable.
  video_dir: 'videos/pendulum'
  imag_video_horizon: 200

dmc_vision:
  steps: 1e6
  action_repeat: 2
  envs: 4
  train_ratio: 512
  video_pred_log: true
  encoder: {mlp_keys: '$^', cnn_keys: 'image'}
  decoder: {mlp_keys: '$^', cnn_keys: 'image'}

crafter:
  task: crafter_reward
  step: 1e6
  action_repeat: 1
  envs: 1
  train_ratio: 512
  video_pred_log: true
  dyn_hidden: 1024
  dyn_deter: 4096
  units: 1024
  encoder: {mlp_keys: '$^', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  decoder: {mlp_keys: '$^', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  actor: {layers: 5, dist: 'onehot', std: 'none'}
  value: {layers: 5}
  reward_head: {layers: 5}
  cont_head: {layers: 5}
  imag_gradient: 'reinforce'

atari100k:
  steps: 4e5
  envs: 1
  action_repeat: 4
  train_ratio: 1024
  video_pred_log: true
  eval_episode_num: 100
  actor: {dist: 'onehot', std: 'none'}
  imag_gradient: 'reinforce'
  stickey: False
  lives: unused
  noops: 30
  resize: opencv
  actions: needed
  time_limit: 108000

minecraft:
  task: minecraft_diamond
  step: 1e8
  parallel: True
  envs: 16
  # no eval
  eval_episode_num: 0
  eval_every: 1e4
  action_repeat: 1
  train_ratio: 16
  video_pred_log: true
  dyn_hidden: 1024
  dyn_deter: 4096
  units: 1024
  encoder: {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath|obs_reward', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  decoder: {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  actor: {layers: 5, dist: 'onehot', std: 'none'}
  value: {layers: 5}
  reward_head: {layers: 5}
  cont_head: {layers: 5}
  imag_gradient: 'reinforce'
  break_speed: 100.0
  time_limit: 36000

memorymaze:
  steps: 1e8
  action_repeat: 2
  actor: {dist: 'onehot', std: 'none'}
  imag_gradient: 'reinforce'
  task: 'memorymaze_9x9'

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20
