# DreamerV3 hyperparameters — fixed across all environments (no domain-specific tuning)

env: Pendulum-v1
seed: 0
device: cuda  # or cpu
total_steps: 500000
eval_every: 10000
eval_episodes: 25            # 25-episode eval for stable best-checkpoint selection
save_dir: checkpoints/{env}  # per-env dir; formatted with config['env'] at runtime
video_dir: videos/{env}      # per-env video dir (used when --record-video is passed)
log_dir: logs                # stdout tee-log dir
imag_video_horizon: 200      # imagined-rollout length for imag_step_*.mp4
log_every: 25

# Replay buffer
replay_capacity: 5000000   # paper Table 4: 5e6. Memory-heavy; 1e6 is fine for Pendulum/state-based obs.
prefill_steps: 1000        # random steps before first gradient update

# Batching
batch_size: 16             # number of sequences per gradient step
batch_length: 64           # timesteps per sequence (T)
train_ratio: 512           # DreamerV3 paper convention (Table 4): number of REPLAY observations
                           # seen per ENV observation. Grad steps per env step =
                           # train_ratio / (batch_size * batch_length). e.g. 512 / 1024 = 0.5
                           # → 1 gradient update every 2 env steps. train.py handles the
                           # fractional case via a `train_debt` accumulator.

# Model architecture
embed_dim: 1024            # encoder output dim
deter_dim: 4096            # GRU hidden state size (deterministic h_t)
stoch_dim: 32              # number of categorical latent variables
stoch_classes: 32          # classes per variable (z_t is 32x32 = 1024 bits)
hidden_dim: 1024           # MLP hidden layer width
num_layers: 2              # hidden layers in MLPs (excl. input/output projections)
num_bins: 255              # bins for TwoHot reward/value distributions
bin_range: 20.0            # symlog-space bin range: covers symexp([-20, 20])
unimix: 0.01               # uniform mixture fraction for categorical distributions

# World model losses (DreamerV3 Eq. 4-5: fixed weights + free bits, no KL balancing)
lambda_pred: 1.0           # prediction loss weight (recon + reward + continue), beta_pred
lambda_dyn: 0.5            # dynamics KL weight (trains prior). WM-01: aligned with reference (dyn_scale=0.5).
lambda_rep: 0.1            # representation KL weight (trains encoder), beta_rep — applied to max(free_bits, KL)
free_bits: 1.0             # minimum KL in nats, clipped per-term (prevents posterior collapse)

# Actor-critic
imag_gradient: dynamics    # AC-01: 'dynamics' (analytic, matches ref default) or 'reinforce' (score-function)
discount: 0.997            # gamma (equivalent to horizon ~333 steps)
lambda_return: 0.95        # TD(lambda) mixing coefficient
imagination_horizon: 16    # H — imagined trajectory length. NOTE: the paper is internally
                           #   inconsistent — Table 4 lists H=15 but the main text (§Critic learning)
                           #   says T=16. Kept at 16 (matches the text); 15 is equally defensible.
actor_entropy: 0.0003      # eta — fixed entropy bonus coefficient
actor_min_std: 0.1         # minimum action std (prevents deterministic collapse)
actor_max_std: 1.0         # maximum action std (prevents unbounded exploration blow-up)
critic_ema_decay: 0.98     # EMA decay for target critic network
critic_repval_scale: 0.3   # critic replay regularization weight
critic_slowreg: 1          # slow regularization weight for critic (prevents overfitting to imagined rollouts)

# Return normalization
ret_norm_decay: 0.99       # EMA decay for percentile statistics
ret_norm_lower_pct: 5.0    # lower percentile for inter-percentile range
ret_norm_upper_pct: 95.0   # upper percentile
ret_norm_min: 1.0          # minimum denominator (prevents amplifying near-zero returns)

# Optimization — Part 1 (Adam + global clip). OP-01: per-network lr/eps/clip matching reference.
lr: 4.0e-5                 # (legacy fallback; per-net lr below is authoritative)
wm_lr: 1.0e-4              # ref model_lr
actor_lr: 3.0e-5           # ref actor.lr (3x smaller than WM)
critic_lr: 3.0e-5          # ref critic.lr
wm_eps: 1.0e-8             # ref opt_eps
actor_eps: 1.0e-5          # ref actor.eps
critic_eps: 1.0e-5         # ref critic.eps
wm_grad_clip: 1000.0       # ref model_grad_clip (10x bigger than actor/critic)
actor_grad_clip: 100.0
critic_grad_clip: 100.0
grad_clip: 100.0           # legacy uniform clip (unused after OP-01)

# Pretrain phase (LP-01)
pretrain: 100              # ref pretrain: WM update steps on prefill data before env interaction

# Optimization — Part 2 (uncomment and set optimizer: laprop)
# optimizer: laprop
# laprop_betas: [0.9, 0.999]
# laprop_epsilon: 1.0e-20  # paper Table 4: LaProp(eps = 1e-20). This unusually small eps is
#                          #   characteristic of LaProp — do NOT use Adam's 1e-8 here.
# agc_lambda: 0.3
