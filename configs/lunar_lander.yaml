# LunarLanderContinuous-v3 — box2d-based continuous-action task.
# obs_dim=8 (x, y, vx, vy, angle, angular_vel, leg1_contact, leg2_contact)
# action_dim=2 (main_engine [-1,1], side_engines [-1,1])
# Episode length up to 1000 steps; sparse-ish shaping reward.
# Requires `gymnasium[box2d]`.
# Imagination-video is NOT implemented for this env (box2d state can't be reconstructed
# from decoded obs). Env-rollout video works fine.

env: LunarLanderContinuous-v3
seed: 0
device: cpu
total_steps: 500000
eval_every: 10000
eval_episodes: 25
imag_video_horizon: 200      # unused (no imag hook), kept for config uniformity
log_every: 100

# Pendulum-sized model. LunarLander obs is 8-dim; capacity fine.
embed_dim: 256
deter_dim: 512
stoch_dim: 16
stoch_classes: 16
hidden_dim: 256
num_layers: 2
